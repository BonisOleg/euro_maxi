<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Дякуємо за замовлення — Euromaxi UA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css?v=5">
  <link rel="stylesheet" href="css/base.css?v=5">
  <link rel="stylesheet" href="css/layout.css?v=5">
  <link rel="stylesheet" href="css/components.css?v=5">
  <link rel="stylesheet" href="css/pages.css?v=5">
</head>
<body>
  <header class="site-header" data-site-header></header>
  <main class="site-main">
    <div class="container">
      <div class="thanks" data-thanks>
        <h1>Дякуємо!</h1>
        <p>Замовлення прийнято. У робочій версії тут буде статус оплати Monobank.</p>
        <a class="btn btn-primary" href="catalog.html">Повернутись до каталогу</a>
      </div>
    </div>
  </main>
  <footer class="site-footer" data-site-footer></footer>
  <script src="js/products.js?v=5"></script>
  <script src="js/cart.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      try {
        var order = JSON.parse(sessionStorage.getItem("chargua_last_order") || "null");
        if (!order) return;
        document.querySelector("[data-thanks]").innerHTML =
          "<h1>Оплату ініційовано</h1>" +
          "<p>Замовлення <strong>" + order.id + "</strong> на суму <strong>" +
          window.formatPrice(order.total) + "</strong>.<br>Оплата: " + order.payment +
          ".<br>Підтвердження надішлемо на " + order.email + ".</p>" +
          '<a class="btn btn-primary" href="catalog.html">До каталогу</a>';
      } catch (e) {}
    });
  </script>
</body>
</html>
