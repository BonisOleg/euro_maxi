# HTTP-first на Droplet. SSL — окремо (django-docker-ssl), не цей файл.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --force-recreate

services:
  db:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  web:
    restart: always
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  nginx:
    restart: always
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_started
