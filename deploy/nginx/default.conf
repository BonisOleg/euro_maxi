# Якщо перед контейнером зʼявиться host-nginx з Certbot (SSL-термінація на хості,
# django-docker-ssl) — він проксує сюди HTTP і має передавати X-Forwarded-Proto.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# LS-37: rate-limit на чутливих ендпоінтах (checkout/контакти/webhook) — захист
# від спаму замовлень/лідів і зайвого навантаження на Monobank webhook.
# zone=10m ~ достатньо записів на IP; rate — на IP, не на сесію (гість без акаунту).
limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location = /checkout/ {
        limit_req zone=checkout_limit burst=5 nodelay;
        proxy_pass http://web:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    location = /contacts/ {
        limit_req zone=contact_limit burst=5 nodelay;
        proxy_pass http://web:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    location = /webhooks/monobank/ {
        limit_req zone=webhook_limit burst=20 nodelay;
        proxy_pass http://web:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    location / {
        proxy_pass http://web:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }
}
